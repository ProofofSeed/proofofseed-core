[package]
name = "proofofseed-circuits"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "The six ProofofSeed statements as ZKBoo circuits, with test vectors, shared by the on-device prover and the host verifier so they agree on each circuit."

[dependencies]
# Resolved to the local working trees by the workspace root's [patch.crates-io].
zkboo = { version = "1.0.0", default-features = false, features = [
    "u32",
    "u64",
    "keccak",
] }
# Volatile zeroing of the witness key material when a circuit is dropped.
zeroize = { version = "1", default-features = false }
# 1.1.0 for `bip39_seed_with_salt_words`: the BIP-39 salt is witness here, and the
# 1.0.0 entry point can only allocate it as public constants.
zkboo-bip32 = { version = "1.1.0" }
zkboo-ecc = { version = "1.0.0" }
# Circuit-structure fingerprinting, bound into the deterministic prover entropy of
# the ranged proving mode (see src/ranged.rs).
zkboo-circuit-hash = { version = "1.0.0" }
# Only for the `flash-comb` feature: reconstructing precomputed Montgomery limbs.
zkboo-modular = { version = "1.0.0", optional = true }

[features]
default = []
# Carry the precomputed secp256k1 comb tables (~80 KB of constants) and the reader
# over them, so a constrained prover can skip the native point arithmetic. Off by
# default: a host recomputes the tables more cheaply than it carries them.
flash-comb = ["dep:zkboo-modular"]

[dev-dependencies]
# Self-dependency with the feature on, so `cargo test -p proofofseed-circuits` always
# builds the flash tables. Without it the parity tests would compile to nothing
# whenever the feature was off — a check that silently disappears is not a check.
proofofseed-circuits = { path = ".", features = ["flash-comb"] }
zkboo-circuit-hash = { version = "1.0.0" }
zkboo-ecc = { version = "1.0.0" }
zkboo-modular = { version = "1.0.0" }
